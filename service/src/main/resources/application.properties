server.port=${PORT:8080}
spring.application.name=cinema-service
springdoc.api-docs.version=OPENAPI_3_0
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-numbers-for-enums=true
spring.jackson.parser.strict-duplicate-detection=true
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# All three values are required to enable real JWT validation.
# Without them, protected operations reject all tokens.
cinema.security.issuer=${JWT_ISSUER:}
cinema.security.jwk-set-uri=${JWT_JWK_SET_URI:}
cinema.security.audience=${JWT_AUDIENCE:}
